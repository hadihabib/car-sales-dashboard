name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android platform files
        shell: bash
        run: |
          cp lib/main.dart /tmp/main.dart
          cp lib/config.dart /tmp/config.dart
          cp pubspec.yaml /tmp/pubspec.yaml
          flutter create . --platforms=android --project-name car_sales_app --org com.hadi
          cp /tmp/main.dart lib/main.dart
          cp /tmp/config.dart lib/config.dart
          cp /tmp/pubspec.yaml pubspec.yaml

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: >
          flutter build apk --release
          --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: car-sales-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
